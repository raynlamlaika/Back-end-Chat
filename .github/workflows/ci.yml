name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mini-chat/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mini-chat/src/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Check app syntax
        run: |
          node --check app.js
          node --check main.js
