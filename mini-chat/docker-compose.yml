services:
  db:
    image: postgres:16-alpine
    container_name: minichat-db
    restart: on-failure
    env_file: 
      .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  db_data:
